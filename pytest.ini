[pytest]
testpaths = tests
asyncio_mode = auto

asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Treat any unhandled DeprecationWarning as a test failure during dev so we
# notice when our deps deprecate something. Comment out if too noisy.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
    ignore::PendingDeprecationWarning
