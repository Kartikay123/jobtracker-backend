[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Make `app` importable from env.py (it lives one dir up).
prepend_sys_path = .

# Migration filenames: 20260505_1923_add_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Use UTC in filenames so collaborators on different timezones produce
# consistent ordering.
timezone = UTC

# The actual URL is set at runtime in env.py from settings.DATABASE_URL.
# Leave blank here so we never accidentally commit credentials.
sqlalchemy.url =


# --- Logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
