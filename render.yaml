# Render Blueprint — free tier configuration.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. On Render: New → Blueprint → connect repo → "Apply".
#      Render reads this file and provisions: api + Redis + Postgres.
#   3. After provisioning, set CORS_ORIGINS on the api service to your
#      Vercel/Netlify frontend URL (Render dashboard → api → Environment).
#
# What's NOT included on the free tier:
#   * Background WORKER service (the arq daemon) — Render's free tier does
#     not allow worker-type services. Everything else (auth, jobs, kanban,
#     analytics, AI endpoints) works fully without it; only the daily
#     follow-up reminder cron is dormant.
#
#     To enable it later: change `plan: free` to `plan: starter` on the api
#     and uncomment the `jobtracker-worker` service block below (~$7/mo each).
#
# Free-tier caveats you should know:
#   * Web service spins DOWN after 15 min idle → first request after that
#     wakes it (cold start ~15-30s). Normal traffic keeps it warm.
#   * Postgres free DB **expires after 90 days** and is deleted. Either
#     upgrade before then or take pg_dump backups.
#   * Redis free is 25 MB and ephemeral (fine — we use it for cache/queue).

services:
  # ----- FastAPI API ----------------------------------------------------
  - type: web
    name: jobtracker-api
    runtime: docker
    plan: free                       # 512MB RAM, 0.5 CPU, spins down when idle
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Postgres now lives on Neon (Render's free DB expired after 90 days).
      # Set this in the Render dashboard to the Neon connection string.
      # Paste it as-is — the app normalizes the scheme and ssl params.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: jobtracker-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true           # Render generates a strong secret once
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app   # CHANGE ME after frontend deploy
      # On free (0.5 CPU, 512MB), one worker leaves headroom for spikes.
      - key: WEB_CONCURRENCY
        value: "1"

  # ----- arq background worker (paid tier only) ------------------------
  # Uncomment this block + change api's `plan: free` → `plan: starter`
  # when you upgrade. Each starter service is $7/mo.
  #
  # - type: worker
  #   name: jobtracker-worker
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: arq app.workers.worker.WorkerSettings
  #   autoDeploy: true
  #   envVars:
  #     - key: ENVIRONMENT
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: jobtracker-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: jobtracker-redis
  #         property: connectionString
  #     - key: JWT_SECRET
  #       fromService:
  #         type: web
  #         name: jobtracker-api
  #         envVarKey: JWT_SECRET     # share the same secret as the api
  #     - key: JWT_ALGORITHM
  #       value: HS256
  #     - key: SKIP_MIGRATIONS
  #       value: "1"                  # api runs migrations; worker doesn't need to

  # ----- Redis ----------------------------------------------------------
  - type: redis
    name: jobtracker-redis
    plan: free                        # 25 MB, ephemeral — fine for cache/queue
    ipAllowList: []                   # internal-only (within the Render network)

# ----- Postgres -------------------------------------------------------
# The free Render Postgres expired after 90 days and was deleted.
# The database now lives on Neon (https://neon.tech) — no Render-managed
# database anymore. DATABASE_URL is set manually on the api service.
